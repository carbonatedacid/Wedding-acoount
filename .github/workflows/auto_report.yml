name: Daily Investment Report

on:
  schedule:
    # 1. 한국 시간 아침 8시 정각 (계절 무관 항상 동일)
    - cron: '0 23 * * *'
    
    # 2. 미국 증시 장 시작 시간 자동 대응
    # 서머타임 기간 (3월 ~ 10월): 한국 시간 밤 10시 30분 (UTC 13:30)
    - cron: '30 13 8-31 3 *'
    - cron: '30 13 * 4-10 *'
    - cron: '30 13 1-7 11 *'
    
    # 서머타임 해제 기간 (11월 ~ 2월): 한국 시간 밤 11시 30분 (UTC 14:30)
    - cron: '30 14 8-31 11 *'
    - cron: '30 14 * 1,2,12 *'
    - cron: '30 14 1-14 3 *'

  workflow_dispatch:

jobs:
  run-bot:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout repository
        uses: actions/checkout@v3

      - name: Set up Python
        uses: actions/setup-python@v4
        with:
          python-version: '3.10'

      - name: Install dependencies
        run: |
          pip install yfinance pandas matplotlib requests pytz

      - name: Run bot script
        run: |
          python Wedding-account.py
